<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n="notfound.title">Page not found</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>

        <!-- Styles (root-absolute so this page works at any missing URL depth) -->
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">
        <style>
            .nf .eyebrow { font-size: 1.2rem; }
            .nf .lede { margin-inline: auto; }
            .nf .cluster { justify-content: center; }
        </style>

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>

        <link rel="stylesheet" href="/styles/upgrades.css">
        <script src="/scripts/upgrades.js"></script>
    </head>

    <body>
        <main-header></main-header>
        <main id="main-content">
            <section class="section">
                <div class="wrap-narrow nf center stack">
                    <p class="eyebrow">404</p>
                    <h1 data-i18n="notfound.title">Page not found</h1>
                    <p class="lede" data-i18n="notfound.body">We couldn't find that page. It may have moved or the link may be mistyped.</p>
                    <div class="cluster">
                        <a class="btn btn-primary" href="/index.html" data-i18n="notfound.home">Back to home</a>
                        <a class="btn btn-quiet" href="/pages/vocab.html" data-i18n="notfound.vocab">Browse vocabulary</a>
                    </div>
                </div>
            </section>
        </main>
        <site-footer></site-footer>
    </body>
</html>

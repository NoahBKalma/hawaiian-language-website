<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n-doc-title="meta.account.title">Account Settings</title>

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/account-settings.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/scripts/account-settings.js" type="module"></script>

        <!-- Page-specific scripts -->
    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
        <main id="main-content">
            <!-- Main page content -->
             <span class="eyebrow" data-i18n="account.eyebrow">Account settings</span>
             <div id="user-info" class="container card">
                <div id="profile-icon" data-i18n-skip><p>X</p></div>
                <h1 id="user" data-i18n-skip>Username</h1>
                <h2 id="email" data-i18n-skip>email@email.com</h2>
             </div>
             <div id="acct-info" class="container card">
                <h2 class="title" data-i18n="account.info.title">Account Info</h2>
                <div class="info-container">
                    <label for="username-input" data-i18n="account.label.username">Username:</label>
                    <input id="username-input" class="input" placeholder="Username" data-i18n-placeholder="account.placeholder.username">
                    <label for="email-input" data-i18n="account.label.email">Email:</label>
                    <input id="email-input" class="input" placeholder="Email" data-i18n-placeholder="account.placeholder.email">
                </div>
                <p id="user-message-account" role="status"></p>
                <button id="save-button" class="save-changes-button btn btn-primary" data-i18n="account.save">Save Changes</button>
             </div>
             <div id="change-password" class="container card">
                <h2 class="title" data-i18n="account.password.title">Change Password</h2>
                <div class="info-container">
                    <label for="curr-password" data-i18n="account.label.current">Current Password:</label>
                    <input id="curr-password" class="input" type="password" placeholder="Old Password" data-i18n-placeholder="account.placeholder.old">
                    <label for="new-password" data-i18n="account.label.new">New Password:</label>
                    <input id="new-password" class="input" type="password" placeholder="New Password" data-i18n-placeholder="account.placeholder.new">
                    <label for="confirm-new-password" data-i18n="account.label.confirmNew">Confirm New Password:</label>
                    <input id="confirm-new-password" class="input" type="password" placeholder="New Password" data-i18n-placeholder="account.placeholder.new">
                </div>
                <p id="user-message-password" role="status"></p>
                <button id="change-password-button" class="save-changes-button btn btn-primary" data-i18n="account.password.update">Update Password</button>
             </div>
             <div id="delete-account" class="container card">
                <h2 class="title" data-i18n="account.delete.title">Delete Account</h2>
                <label id="delete-prompt" for="delete-input" data-i18n="account.delete.prompt">Type password to confirm:</label>
                <input id="delete-input" class="input" type="password" placeholder="Confirm Delete" data-i18n-placeholder="account.delete.placeholder">
                <button id="delete-account-button" class="btn" data-i18n="account.delete.button">Delete Account</button>
             </div>
        </main>
        <site-footer></site-footer>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/aloalo-icon.svg" type="image/svg+xml">
        <title>Account Settings</title>

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/account-settings.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/scripts/account-settings.js" type="module"></script>

        <!-- Page-specific scripts -->
    </head>

    <body>
        <main-header></main-header>
        <main id="main-content">
            <!-- Main page content -->
             <span class="eyebrow">Account settings</span>
             <div id="user-info" class="container card">
                <div id="profile-icon"><p>X</p></div>
                <h1 id="user">Username</h1>
                <h2 id="email">email@email.com</h2>
             </div>
             <div id="acct-info" class="container card">
                <h2 class="title">Account Info</h2>
                <div class="info-container">
                    <label for="username-input">Username:</label>
                    <input id="username-input" class="input" placeholder="Username">
                    <label for="email-input">Email:</label>
                    <input id="email-input" class="input" placeholder="Email">
                </div>
                <p id="user-message-account" role="status"></p>
                <button id="save-button" class="save-changes-button btn btn-primary">Save Changes</button>
             </div>
             <div id="change-password" class="container card">
                <h2 class="title">Change Password</h2>
                <div class="info-container">
                    <label for="curr-password">Current Password:</label>
                    <input id="curr-password" class="input" type="password" placeholder="Old Password">
                    <label for="new-password">New Password:</label>
                    <input id="new-password" class="input" type="password" placeholder="New Password">
                    <label for="confirm-new-password">Confirm New Password:</label>
                    <input id="confirm-new-password" class="input" type="password" placeholder="New Password">
                </div>
                <p id="user-message-password" role="status"></p>
                <button id="change-password-button" class="save-changes-button btn btn-primary">Update Password</button>
             </div>
             <div id="delete-account" class="container card">
                <h2 class="title">Delete Account</h2>
                <label id="delete-prompt" for="delete-input">Type password to confirm:</label>
                <input id="delete-input" class="input" type="password" placeholder="Confirm Delete">
                <button id="delete-account-button" class="btn">Delete Account</button>
             </div>
        </main>
        <site-footer></site-footer>
    </body>
</html>

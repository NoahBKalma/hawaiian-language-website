<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Flashcards</title>

        <!-- Styles -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">
        <link rel="stylesheet" href="/styles/practice-layout.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/flashcards.css">
        <link rel="stylesheet" href="/styles/flashcard-tutorial.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/components/practice-sets.js" type="module"></script>
        
        <link rel="stylesheet" href="/styles/toast.css">
        <script src="/scripts/progress.js" type="module"></script>

        <!-- Page-specific scripts -->
        <script src="/scripts/flashcards.js" type="module"></script>
        <script src="/scripts/flashcard-tutorial.js" type="module"></script>
        <script src="/scripts/set-selection.js" type="module"></script>
        

    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
            <main id="main-content">
                <!-- Main page content -->
                <div id="card-container">
                    <p class="save-progress-note" hidden>Log in to save your streak and achievements. <a href="/pages/login.html">Log in</a></p>
                    <h1 id="category-title">Select Set</h1>
                    <div id="tally-bar">
                        <span class="tally correct-tally">Correct <strong id="tally-correct">0</strong></span>
                        <span class="tally incorrect-tally">Incorrect <strong id="tally-incorrect">0</strong></span>
                        <span class="tally remaining-tally">Remaining <strong id="tally-remaining">0</strong></span>
                        <span class="tally retry-tally" hidden>Retry <strong id="tally-retry">0</strong></span>
                    </div>
                    <div id="card" role="button" tabindex="0" aria-label="Flashcard, press Space to flip">
                        <div class="card-inner">
                            <div class="card-face front"></div>
                            <div class="card-face back"></div>
                        </div>
                        <div class="card-tint"></div>
                        <div class="card-badge" hidden></div>
                    </div>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                    <div id="grade-buttons">
                        <button id="grade-incorrect" type="button" aria-label="Mark incorrect (X)"><span class="grade-icon" aria-hidden="true">&#10007;</span> Incorrect</button>
                        <button id="grade-correct" type="button" aria-label="Mark correct (C)"><span class="grade-icon" aria-hidden="true">&#10003;</span> Correct</button>
                    </div>
                    <div id="deck-summary" hidden>
                        <div class="summary-mark" aria-hidden="true">&#10003;</div>
                        <h2>Deck complete</h2>
                        <p id="summary-score"></p>
                        <p id="summary-ungraded"></p>
                        <div id="summary-actions">
                            <button id="restart-all" type="button">Restart all</button>
                        </div>
                    </div>
                    <div id="card-options">
                        <button id="spaced-repetition-button" type="button" disabled aria-label="Spaced repetition (coming soon)" title="Spaced repetition: coming soon">
                            <img src="/assets/icons/spaced-repetition-icon.svg" alt="">
                        </button>
                        <button id="favorite-set-button" type="button" aria-label="Favorite this set" title="Favorite this set">
                            <img src="/assets/icons/not-favorited-icon.svg" alt="">
                        </button>
                        <button id="save-continue-button" type="button" aria-label="Save progress" title="Save progress">
                            <img src="/assets/icons/save-icon.svg" alt="">
                        </button>
                        <div id="card-navigation">
                            <button id="restart-button" type="button" aria-label="Restart" title="Restart"><img src="/assets/icons/restart-icon.svg" alt=""></button>
                            <button id="previous-button" type="button" aria-label="Previous card" title="Previous card"><img src="/assets/icons/previous-card-icon.svg" alt=""></button>
                            <p id="num-progress"></p>
                            <button id="next-button" type="button" aria-label="Next card" title="Next card"><img src="/assets/icons/next-card-icon.svg" alt=""></button>
                            <button id="shuffle-button" type="button" aria-label="Shuffle" title="Shuffle"><img src="/assets/icons/shuffle-icon.svg" alt=""></button>
                        </div>
                        <button id="tutorial-button" type="button" aria-haspopup="dialog" aria-label="How it works" title="How it works">
                            <img src="/assets/icons/help-icon.svg" alt="">
                        </button>
                        <button id="fullscreen-button" type="button" aria-label="Full screen" title="Full screen">
                            <img src="/assets/icons/maximize-icon.svg" alt="">
                        </button>
                    </div>
                    <p id="message"></p>
                </div>
                <practice-layout></practice-layout>
            </main>
        <site-footer></site-footer>
    </body>
</html>

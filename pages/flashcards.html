<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title data-i18n-doc-title="meta.flashcards.title">Flashcards</title>
        <meta name="description" content="Practice Hawaiian vocabulary with flip cards, spaced repetition and saved progress." data-i18n-meta="meta.flashcards.description">

        <!-- Styles -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">
        <link rel="stylesheet" href="/styles/practice-layout.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/flashcards.css">
        <link rel="stylesheet" href="/styles/flashcard-tutorial.css">
        <link rel="stylesheet" href="/styles/spaced-tutorial.css">
        <link rel="stylesheet" href="/styles/help-menu.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/components/practice-sets.js" type="module"></script>
        
        <link rel="stylesheet" href="/styles/toast.css">
        <script src="/scripts/progress.js" type="module"></script>

        <!-- Page-specific scripts -->
        <script src="/scripts/flashcards.js" type="module"></script>
        <script src="/scripts/help-menu.js" type="module"></script>
        <script src="/scripts/set-selection.js" type="module"></script>
        

    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
            <main id="main-content">
                <!-- Main page content -->
                <div id="card-container">
                    <p class="save-progress-note" hidden><span data-i18n-html="common.saveNote-html">Log in to save your streak and achievements. <a href="/pages/login.html">Log in</a></span></p>
                    <h1 id="category-title" data-i18n-skip>Select Set</h1>
                    <div id="tally-bar">
                        <span class="tally correct-tally"><span data-i18n="flashcards.tally.correct">Correct</span> <strong id="tally-correct">0</strong></span>
                        <span class="tally incorrect-tally"><span data-i18n="flashcards.tally.incorrect">Incorrect</span> <strong id="tally-incorrect">0</strong></span>
                        <span class="tally remaining-tally"><span data-i18n="flashcards.tally.remaining">Remaining</span> <strong id="tally-remaining">0</strong></span>
                        <span class="tally retry-tally" hidden><span data-i18n="flashcards.tally.retry">Retry</span> <strong id="tally-retry">0</strong></span>
                    </div>
                    <p id="mode-badge" class="mode-badge" hidden></p>
                    <div id="card" role="button" tabindex="0" aria-label="Flashcard, press Space to flip" data-i18n-aria-label="flashcards.card.aria">
                        <div class="card-inner" data-i18n-skip>
                            <div class="card-face front"></div>
                            <div class="card-face back"></div>
                        </div>
                        <div class="card-tint"></div>
                        <div class="card-badge" hidden></div>
                    </div>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                    <div id="grade-buttons">
                        <button id="grade-incorrect" type="button" aria-label="Mark incorrect (X)" data-i18n-aria-label="flashcards.grade.incorrect.aria"><span class="grade-icon" aria-hidden="true">&#10007;</span> <span data-i18n="flashcards.grade.incorrect">Incorrect</span></button>
                        <button id="grade-correct" type="button" aria-label="Mark correct (C)" data-i18n-aria-label="flashcards.grade.correct.aria"><span class="grade-icon" aria-hidden="true">&#10003;</span> <span data-i18n="flashcards.grade.correct">Correct</span></button>
                    </div>
                    <div id="deck-summary" hidden>
                        <div class="summary-mark" aria-hidden="true">&#10003;</div>
                        <h2>Deck complete</h2>
                        <p id="summary-score"></p>
                        <p id="summary-ungraded"></p>
                        <div id="summary-actions">
                            <button id="review-missed" type="button" hidden><span data-i18n="practice.reviewMissed">Review missed</span> (<span id="review-missed-count">0</span>)</button>
                            <button id="restart-all" type="button" data-i18n="flashcards.summary.restartAll">Restart all</button>
                        </div>
                        <p id="review-missed-note" hidden data-i18n="practice.practiceNote">Practice only: doesn't change your schedule.</p>
                    </div>
                    <div id="caught-up" hidden>
                        <div class="summary-mark" aria-hidden="true">&#10003;</div>
                        <h2 data-i18n="practice.caughtUp">All caught up!</h2>
                        <p id="next-due"></p>
                        <button id="study-full-set" type="button" data-i18n="practice.studyFullSet">Study full set anyway</button>
                    </div>
                    <div id="card-options">
                        <button id="spaced-repetition-button" class="sr-switch" type="button" role="switch" aria-checked="false" aria-label="Spaced repetition" data-i18n-aria-label="practice.spaced.aria" title="Spaced repetition: off"><span class="sw-thumb" aria-hidden="true"><img src="/assets/icons/spaced-repetition-icon.svg" alt=""></span><span class="sw-text" aria-hidden="true"><span class="sw-name" data-i18n="practice.spaced.name">Spaced</span><span class="sw-state">Off</span></span></button>
                        <button id="favorite-set-button" type="button" aria-label="Favorite this set" title="Favorite this set" data-i18n-aria-label="flashcards.favorite" data-i18n-title="flashcards.favorite">
                            <img src="/assets/icons/not-favorited-icon.svg" alt="">
                        </button>
                        <button id="save-continue-button" type="button" aria-label="Save progress" data-i18n-aria-label="flashcards.save" title="Save progress">
                            <img src="/assets/icons/save-icon.svg" alt="">
                        </button>
                        <div id="card-navigation">
                            <button id="restart-button" type="button" aria-label="Restart" title="Restart" data-i18n-aria-label="practice.restart" data-i18n-title="practice.restart"><img src="/assets/icons/restart-icon.svg" alt=""></button>
                            <button id="previous-button" type="button" aria-label="Previous card" title="Previous card" data-i18n-aria-label="flashcards.prev" data-i18n-title="flashcards.prev"><img src="/assets/icons/previous-card-icon.svg" alt=""></button>
                            <p id="num-progress"></p>
                            <button id="next-button" type="button" aria-label="Next card" title="Next card" data-i18n-aria-label="flashcards.next" data-i18n-title="flashcards.next"><img src="/assets/icons/next-card-icon.svg" alt=""></button>
                            <button id="shuffle-button" type="button" aria-label="Shuffle" title="Shuffle" data-i18n-aria-label="practice.shuffle" data-i18n-title="practice.shuffle"><img src="/assets/icons/shuffle-icon.svg" alt=""></button>
                        </div>
                        <button id="tutorial-button" type="button" data-tutorial-page="flashcards" aria-haspopup="menu" aria-expanded="false" aria-label="Help" title="Help" data-i18n-aria-label="common.help" data-i18n-title="common.help">
                            <img src="/assets/icons/help-icon.svg" alt="">
                        </button>
                        <button id="fullscreen-button" type="button" aria-label="Full screen" title="Full screen" data-i18n-aria-label="practice.fullscreen" data-i18n-title="practice.fullscreen">
                            <img src="/assets/icons/maximize-icon.svg" alt="">
                        </button>
                    </div>
                    <p id="message"></p>
                </div>
                <practice-layout></practice-layout>
            </main>
        <site-footer></site-footer>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n-doc-title="meta.login.title">Login / Register</title>

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/login.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module" defer></script>

        <!-- Page-specific scripts -->
        <script src="/scripts/login.js" type="module"></script>
    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
        <main id="main-content">
            <div class="auth-blobs" aria-hidden="true">
                <span class="blob blob-sun"></span>
                <span class="blob blob-sea"></span>
            </div>
            <div class="auth-intro">
                <span class="eyebrow" data-i18n="login.eyebrow">Your account</span>
                <h1 data-i18n="login.title">Log in or register</h1>
                <p class="lede" data-i18n="login.lede">Save your progress, streaks and favorite sets.</p>
            </div>
            <div class="auth-card">
                <div id="login-register-option-container" class="tabs">
                    <button id="register-button" class="tab" data-i18n="login.tab.register">Register</button>
                    <button id="login-button" class="tab" data-i18n="login.tab.login">Login</button>
                </div>
                <form id="auth-input-container" novalidate>
                    <div class="input-container">
                        <label for="username-input" data-i18n="login.label.username">Username:</label><input id="username-input" name="username" class="input" autocomplete="username" autocapitalize="off" spellcheck="false">
                    </div>
                    <div class="input-container">
                        <label for="email-input" data-i18n="login.label.email">Email:</label><input id="email-input" name="email" type="email" class="input" autocomplete="email" autocapitalize="off" spellcheck="false">
                    </div>
                    <div class="input-container">
                        <label for="password-input" data-i18n="login.label.password">Password:</label>
                        <div class="pw-field"><input id="password-input" name="password" class="input" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" aria-pressed="false" data-for="password-input"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></div>
                    </div>
                    <div class="input-container">
                        <label for="confirm-password-input" data-i18n="login.label.confirm">Confirm Password:</label>
                        <div class="pw-field"><input id="confirm-password-input" name="confirm-password" class="input" type="password" autocomplete="new-password"><button type="button" class="pw-toggle" aria-pressed="false" data-for="confirm-password-input"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></div>
                    </div>
                    <div id="enter-container">
                        <button id="enter-button" type="submit" class="btn btn-primary" data-i18n="login.enter">Enter</button>
                        <p id="user-message" class="error" role="status" data-i18n-skip>Error Message Example</p>
                    </div>
                    <p id="forgot-note" class="forgot-note" data-i18n-html="login.forgot-html">Forgot your password? Email <a href="mailto:nkalma@middlebury.edu">nkalma@middlebury.edu</a></p>
                </form>
            </div>
        </main>
        <site-footer></site-footer>
    </body>
</html>

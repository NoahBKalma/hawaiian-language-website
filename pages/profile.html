<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n-doc-title="meta.profile.title">Profile</title>

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/profile.css">
        <link rel="stylesheet" href="/styles/warm-tooltip.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/scripts/profile.js" type="module"></script>

        <!-- Page-specific scripts -->
        <script src="/scripts/profile-spaced.js" type="module"></script>
        <script src="/scripts/warm-tooltip.js" type="module"></script>
    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
        <main id="main-content">
            <div id="profile-banner">
                <div id="profile-icon-container">
                    <p data-i18n-skip>X</p>
                </div>
                <div class="banner-text">
                    <h1 id="username" data-i18n-skip>username</h1>
                    <div id="acct-buttons">
                        <button id="logout-button" class="btn btn-quiet btn-sm" data-i18n="profile.logout">Logout</button>
                        <a id="settings-button" class="btn btn-sm" href="/pages/account-settings.html" data-i18n="profile.settings">Account Settings</a>
                    </div>
                </div>
                <div id="streak-display" aria-live="polite"></div>
            </div>
            <div id="profile-info">
                <h2 class="section-title" data-i18n="profile.achievements">Achievements</h2>
                <div id="badges" aria-busy="true"><p class="badges-status" data-i18n="profile.loading.badges">Loading achievements&hellip;</p></div>

                <h2 class="section-title" id="spaced-title" data-i18n="profile.spaced.title">Spaced Repetition</h2>
                <section id="spaced-section" aria-labelledby="spaced-title" aria-busy="true"><p class="badges-status" data-i18n="profile.loading.reviews">Loading your reviews&hellip;</p></section>

                <h2 class="section-title" data-i18n="profile.continue.title">Continue Learning</h2>
                <div id="continue-section"></div>

                <h2 class="section-title" data-i18n="profile.favorites.title">Favorited Sets</h2>
                <div id="favorite-set-list"></div>
            </div>
        </main>
        <site-footer></site-footer>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n-doc-title="meta.phrases">Vocab - Phrases</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>

        <!-- Styles -->
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/hawaiian-keyboard.css">
        <link rel="stylesheet" href="/styles/vocab.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>

        <!-- Page-specific scripts -->
        <script src="/components/hawaiian-keyboard.js" type="module"></script>
        <script src="/scripts/phrases.js" type="module"></script>
    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
        <main id="main-content" class="vocab-main">
            <section class="page-hero page-hero--flat v-hero">
                <span class="blob blob-sun" aria-hidden="true"></span>
                <div class="wrap">
                    <nav class="vocab-breadcrumb eyebrow" aria-label="Breadcrumb" data-i18n-aria-label="vocab.crumb.aria">
                        <a href="/pages/vocab.html" data-i18n="vocab.title">Vocab</a> <span aria-hidden="true">/</span> <span aria-current="page" data-i18n="vocab.path.phrases">Phrases</span>
                    </nav>
                    <header class="vocab-page-header">
                        <h1 class="vocab-title" data-i18n="vocab.path.phrases">Phrases</h1>
                        <p class="vocab-intro lede" data-i18n="phrases.intro">Short phrases grouped by topic. Open any set in flashcards or writing practice.</p>
                    </header>
                </div>
            </section>

            <section class="section-sm">
                <div class="wrap">
                    <div class="v-search phrase-filter-bar">
                        <div class="field">
                            <label for="phrase-filter" data-i18n="phrases.filter.label">Filter phrases</label>
                            <div class="search">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                                <hawaiian-keyboard>
                                    <input class="input" type="search" id="phrase-filter" placeholder="Filter by topic or phrase" data-i18n-placeholder="phrases.filter.placeholder" autocomplete="off">
                                </hawaiian-keyboard>
                            </div>
                        </div>
                    </div>
                    <p id="phrase-count" class="phrase-count" aria-live="polite"></p>

                    <div id="phrase-groups">
                        <p class="vocab-message" data-i18n="phrases.loading">Loading phrases…</p>
                    </div>
                </div>
            </section>
        </main>
        <site-footer></site-footer>
    </body>
</html>

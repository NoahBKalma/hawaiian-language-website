<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/aloalo-icon.svg" type="image/svg+xml">
        <title>Vocab - Word Bank</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>document.documentElement.classList.add("js");</script>

        <!-- Styles -->
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/hawaiian-keyboard.css">
        <link rel="stylesheet" href="/styles/vocab.css">

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>

        <!-- Page-specific scripts -->
        <script src="/components/hawaiian-keyboard.js" type="module"></script>
        <script src="/scripts/word-bank.js" type="module"></script>
    </head>

    <body>
        <main-header></main-header>
        <main id="main-content" class="vocab-main">
            <section class="page-hero page-hero--flat v-hero">
                <span class="blob blob-sun" aria-hidden="true"></span>
                <div class="wrap">
                    <nav class="vocab-breadcrumb eyebrow" aria-label="Breadcrumb">
                        <a href="/pages/vocab.html">Vocab</a> <span aria-hidden="true">/</span> <span aria-current="page">Word Bank</span>
                    </nav>
                    <header class="vocab-page-header">
                        <h1 class="vocab-title">Word Bank</h1>
                    </header>

                    <div class="v-search">
                        <form id="search-container" class="vocab-search" role="search" autocomplete="off">
                            <div class="field">
                                <label for="search-bar">Search vocab</label>
                                <div class="search-row">
                                    <div class="search">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                                        <hawaiian-keyboard>
                                            <input class="input" type="search" id="search-bar" name="word" placeholder="Search Hawaiian or English" autocomplete="off">
                                        </hawaiian-keyboard>
                                    </div>
                                    <button type="submit" id="search-button" class="btn btn-primary">Search</button>
                                    <button type="reset" id="reset-button" class="btn btn-quiet">Reset</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="section-sm">
                <div class="wrap">
                    <div id="search-results" class="search-results" aria-live="polite" hidden></div>

                    <div id="word-bank-panels">
                        <div class="vocab-tabs tabs" role="tablist" aria-label="Browse words">
                            <button type="button" class="vocab-tab" role="tab" id="tab-frequency" data-mode="frequency" aria-controls="panel-frequency" aria-selected="true">By Frequency</button>
                            <button type="button" class="vocab-tab" role="tab" id="tab-type" data-mode="type" aria-controls="panel-type" aria-selected="false" tabindex="-1">By Type</button>
                        </div>
                        <section id="panel-frequency" class="vocab-panel" role="tabpanel" aria-labelledby="tab-frequency">
                            <p class="vocab-message">Loading words…</p>
                        </section>
                        <section id="panel-type" class="vocab-panel" role="tabpanel" aria-labelledby="tab-type" hidden>
                            <p class="vocab-message">Loading words…</p>
                        </section>
                    </div>
                </div>
            </section>
        </main>
        <site-footer></site-footer>
    </body>
</html>

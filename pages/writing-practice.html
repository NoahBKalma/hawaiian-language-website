<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="/assets/logo/site-logo-icon.svg" type="image/svg+xml">
        <title data-i18n-doc-title="meta.writing.title">Writing Practice</title>
        <meta name="description" content="Practice typing Hawaiian words from English prompts, with hints, streaks and spaced repetition." data-i18n-meta="meta.writing.description">

        <!-- Styles -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
        <script>
        (function () {
          var d = document.documentElement, l, w;
          try {
            l = localStorage.getItem("olelo:siteLang");
            if (l !== "en" && l !== "haw") {
              try { w = JSON.parse(localStorage.getItem("olelo:lang:writing")); } catch (e) {}
              l = w === "hawaiian" ? "haw" : "en";
              localStorage.setItem("olelo:siteLang", l);
              localStorage.removeItem("olelo:lang:writing");
            }
          } catch (e) {}
          l = l === "haw" ? "haw" : "en"; d.lang = l; d.dataset.lang = l;
          if (l === "haw") { d.classList.add("i18n-pending"); setTimeout(function () { d.classList.remove("i18n-pending"); }, 1200); }
        })();
        </script>
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/site.css">
        <link rel="stylesheet" href="/styles/writing-practice.css">
        <link rel="stylesheet" href="/styles/practice-layout.css">
        <link rel="stylesheet" href="/styles/hawaiian-keyboard.css">

        <!-- Page-specific styles -->
        <link rel="stylesheet" href="/styles/flashcard-tutorial.css">
        <link rel="stylesheet" href="/styles/spaced-tutorial.css">
        <link rel="stylesheet" href="/styles/writing-tutorial.css">
        <link rel="stylesheet" href="/styles/help-menu.css">
        <link rel="stylesheet" href="/styles/warm-tooltip.css">
        <script src="/scripts/help-menu.js" type="module"></script>

        <!-- Scripts -->
        <script src="/components/main-header.js" type="module"></script>
        <script src="/components/site-footer.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        <script src="/components/practice-sets.js" type="module"></script>
        <script src="/components/hawaiian-keyboard.js" type="module"></script>

        
        <link rel="stylesheet" href="/styles/toast.css">
        <script src="/scripts/progress.js" type="module"></script>

        <!-- Page-specific scripts -->
        <!-- set-selection.js waits on the word data (top-level await). Safari ran writing-practice.js before it had
             finished ("Cannot access onSetChange before initialization"), and swapping the two tags only broke the set
             lists. So load them in order by hand: writing-practice.js starts only once set-selection.js is fully ready. -->
        <script type="module">
            import("/scripts/set-selection.js").then(function () { return import("/scripts/writing-practice.js"); });
        </script>


    <script src="/scripts/warm-tooltip.js" type="module"></script>
    <link rel="stylesheet" href="/styles/upgrades.css">
<script src="/scripts/upgrades.js"></script>
</head>

    <body>
        <main-header></main-header>
            <main id="main-content">
                <div id="practice-container">
                    <p class="save-progress-note" hidden><span data-i18n-html="common.saveNote-html">Log in to save your streak and achievements. <a href="/pages/login.html">Log in</a></span></p>
                    <div id="streak-container">
                        <div id="curr-streak" class="streak">Current Streak<br>0</div>
                        <h1 id="category-title" data-i18n-skip>Title</h1>
                        <div id="max-streak" class="streak">Max Streak<br>0</div>
                    </div>
                    <p id="mode-badge" class="mode-badge" hidden></p>
                    <div class="plank">
                        <div id="word-container">
                            <p id="word" data-i18n-skip></p>
                            <p id="word-title"></p>
                            <p id="hint-display" aria-live="polite"></p>
                            <p id="retry-label" hidden></p>
                        </div>
                    </div>
                    <div id="caught-up" hidden>
                        <h2 data-i18n="practice.caughtUp">All caught up!</h2>
                        <p id="next-due"></p>
                        <button id="study-full-set" type="button" data-i18n="practice.studyFullSet">Study full set anyway</button>
                    </div>
                    <div id="review-missed-panel" hidden>
                        <button id="review-missed" type="button"><span data-i18n="practice.reviewMissed">Review missed</span> (<span id="review-missed-count">0</span>)</button>
                        <p id="review-missed-note" data-i18n="practice.practiceNote">Practice only: doesn't change your schedule.</p>
                    </div>
                    <div id="error-popup" class="hidden"></div>
                    <div id="answer-row">
                        <div class="answer-field">
                            <label class="answer-label" for="word-input" data-i18n="writing.answer.label">Your answer</label>
                            <hawaiian-keyboard><input id="word-input" aria-labelledby="word-title word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></hawaiian-keyboard>
                        </div>
                        <button id="hint-button" type="button">Hint</button>
                    </div>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                    <div id="word-options">
                            <button id="spaced-repetition-button" class="sr-switch" type="button" role="switch" aria-checked="false" aria-label="Spaced repetition" data-i18n-aria-label="practice.spaced.aria" title="Spaced repetition: off"><span class="sw-thumb" aria-hidden="true"><img src="/assets/icons/spaced-repetition-icon.svg" alt=""></span><span class="sw-text" aria-hidden="true"><span class="sw-name" data-i18n="practice.spaced.name">Spaced</span><span class="sw-state">Off</span></span></button>
                            <button id="restart-button" type="button" data-tip aria-label="Restart" title="Restart" data-i18n-aria-label="practice.restart" data-i18n-title="practice.restart"><img src="/assets/icons/restart-icon.svg" alt=""></button>
                            <button id="shuffle-button" type="button" data-tip aria-label="Shuffle" title="Shuffle" data-i18n-aria-label="practice.shuffle" data-i18n-title="practice.shuffle"><img src="/assets/icons/shuffle-icon.svg" alt=""></button>
                            <p id="num-progress">0 / 0</p>
                            <button id="help-button" type="button" data-tip data-tutorial-page="writing" aria-haspopup="menu" aria-expanded="false" aria-label="Help" title="Help" data-i18n-aria-label="common.help" data-i18n-title="common.help"><img src="/assets/icons/help-icon.svg" alt=""></button>
                            <button id="fullscreen-button" type="button" data-tip aria-label="Full screen" title="Full screen" data-i18n-aria-label="practice.fullscreen" data-i18n-title="practice.fullscreen"><img src="/assets/icons/maximize-icon.svg" alt=""></button>
                        </div>
                </div>
                <practice-layout></practice-layout>
            </main>
        <site-footer></site-footer>
    </body>
</html>

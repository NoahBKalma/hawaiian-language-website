<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Writing Practice</title>

        <!-- Styles -->
        <link rel="stylesheet" href="/styles/global-styles.css">
        <link rel="stylesheet" href="/styles/header.css">
        <link rel="stylesheet" href="/styles/navigation.css">
        <link rel="stylesheet" href="/styles/writing-practice.css">

        <!-- Page-specific styles -->

        <!-- Scripts -->
        <script src="/components/side-nav.js" defer></script>
        <script src="/components/main-header.js" type="module"></script>
        <script src="/scripts/global.js" type="module"></script>
        
        <!-- Page-specific scripts -->
        <script src="/scripts/writing-practice.js" type="module"></script>
    </head>

    <body>
        <main-header>Writing practice</main-header>
        <div id="main-site-layout">
            <side-nav></side-nav>
            <main id="main-content">
                <h1 id="practice-title" class="page-title-font">Hawaiian Writing Practice</h1>
                <div id="practice-container">
                    <div id="streak-container">
                        <h3 id="curr-streak" class="streak">Current Streak<br>0</h3>
                        <h2 id="set-title">Title</h2>
                        <h3 id="max-streak" class="streak">Max Streak<br>0</h3>
                    </div>
                    <div id="word-container">
                        <h4 id="word">Word</h4>
                        <h3 id="word-title">Translate to LANGUAGE</h3>
                    </div>
                    <input id="word-input">
                    <div id="word-options">
                            <button id="spaced-repetition-button"><img src="/assets/icons/spaced-repetition-icon.svg"></button>
                            <button id="restart-button"><img src="/assets/icons/restart-icon.svg"></button>
                            <button id="shuffle-button"><img src="/assets/icons/shuffle-icon.svg"></button>
                            <button id="fullscreen-button"><img src="/assets/icons/maximize-icon.svg"></button>
                        </div>
                </div>
            </main>
        </div>
    </body>
</html>
